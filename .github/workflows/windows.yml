name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test-and-build:
    runs-on: windows-latest

    # 仅发布步骤需要写权限；推送 v* tag 时才会用到。
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group build

      - name: Run tests with strict warnings
        run: uv run python -W error -m unittest discover -v

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests

      - name: Check JavaScript syntax
        run: node --check assets/ui/app.js

      - name: Check installed dependencies
        run: uv pip check

      - name: Build portable executable
        shell: pwsh
        run: ./build.ps1

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\PathCraft.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "PathCraft.exe exited during startup with code $($process.ExitCode)"
          }
          Stop-Process -Id $process.Id

      - name: Upload portable executable
        uses: actions/upload-artifact@v7
        with:
          name: PathCraft-Windows
          path: dist/PathCraft.exe
          if-no-files-found: error

      # 推送 v* tag 时把同一次构建产出的 exe 发布到 GitHub Release。
      # Release 附件不会像 artifact 那样 90 天过期。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: PathCraft ${{ github.ref_name }}
          files: dist/PathCraft.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
